# =============================================
# Cấu hình PID cho xe cân bằng hai bánh
# =============================================
# Các giá trị mặc định này là điểm khởi đầu hợp lý.
# Dùng pid_tuner để tìm giá trị tối ưu cho robot của bạn.
#
# Thay đổi runtime:
#   ros2 param set /balance_controller kp 60.0
#   ros2 param set /balance_controller ki 1.0
#   ros2 param set /balance_controller kd 8.0
# =============================================

balance_controller:
  ros__parameters:
    # --- Hệ số PID chuẩn cho xe cân bằng hai bánh ---
    kp: 52.0              # Proportional - phản ứng tỉ lệ với sai số
    ki: 0.8               # Integral     - triệt tiêu sai số xác lập (nhỏ để chống trôi)
    kd: 5.5               # Derivative   - giảm chấn, dập tắt dao động

    # --- Mục tiêu ---
    target_pitch: 0.0     # Góc pitch mục tiêu (rad). 0 = đứng thẳng

    # --- Giới hạn ---
    max_velocity: 1.5     # Vận tốc tối đa (m/s)
    integral_max: 10.0    # Giới hạn anti-windup cho tích phân

    # --- Bộ lọc ---
    derivative_filter_alpha: 0.1  # Hệ số lọc đạo hàm (0-1, nhỏ = lọc mạnh)

    # --- Tùy chọn ---
    use_gyro_derivative: true     # Dùng gyro cho đạo hàm (khuyến nghị)
    fall_threshold: 0.785         # Ngưỡng ngã (~45°). Dừng motor khi vượt qua
    enabled: true                 # Bật/tắt controller

    # --- Vòng điều khiển Vận tốc & Vị trí (Chống trôi xe - Cascaded Loop) ---
    enable_velocity_control: true # Bật tự động phanh chống trôi
    kp_velocity: 0.08             # Giảm chấn vận tốc êm dịu, không giật
    kp_position: 0.015            # Lực kéo vị trí nhẹ nhàng, chống lắc lư
    max_pitch_adjustment: 0.06    # Giới hạn góc ngửa tối đa (~3.5 độ) êm ái


# =============================================
# Cấu hình PID Auto-Tuner (2 Pha)
# =============================================
# Pha 1: Relay Feedback (Ziegler-Nichols) → Tìm PID gần đúng (~15s)
# Pha 2: PSO Fine-tune 2D (Kp, Kd)      → Tinh chỉnh (~2 phút)

pid_tuner:
  ros__parameters:
    # --- An toàn & Giới hạn ---
    fall_threshold: 0.785       # Ngưỡng ngã (rad, ~45°)
    max_velocity: 1.5           # Vận tốc tối đa (m/s)

    # --- Pha 1: Relay Feedback (Ziegler-Nichols) ---
    relay_amplitude: 0.5        # Biên độ relay (m/s). Giảm nếu robot ngã khi relay
    relay_duration: 12.0        # Thời gian relay tối đa (giây)
    relay_hysteresis: 0.005     # Ngưỡng hysteresis chống rung (rad, ~0.3°)

    # --- Pha 2: PSO Fine-tune 2D (chỉ tìm Kp, Kd) ---
    num_particles: 4            # Số hạt PSO (ít hơn vì chỉ 2D)
    max_generations: 3          # Số thế hệ (gen 1-2: fitness đơn giản, gen 3: IEEE)

    # --- Thời gian thử nghiệm ---
    balance_duration: 4.5       # Thời gian kiểm tra đứng yên (giây)
    recovery_duration: 4.5      # Thời gian kiểm tra phục hồi sau huých (giây)

    # --- Bộ nhớ học AI ---
    # Nếu robot ngã ngay từ đầu, đặt reset_memory: true để xóa bộ nhớ cũ.
    reset_memory: false

    # --- Lưu kết quả ---
    output_file: '~/tuned_pid_params.yaml'
