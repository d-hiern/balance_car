# =============================================
# Cấu hình PID cho xe cân bằng hai bánh
# =============================================
# Các giá trị mặc định này là điểm khởi đầu hợp lý.
# Dùng pid_tuner để tìm giá trị tối ưu cho robot của bạn.
#
# Thay đổi runtime:
#   ros2 param set /balance_controller kp 60.0
#   ros2 param set /balance_controller ki 1.0
#   ros2 param set /balance_controller kd 8.0
# =============================================

balance_controller:
  ros__parameters:
    # --- Hệ số PID chuẩn cho xe cân bằng hai bánh ---
    kp: 48.0            # Proportional - phản ứng tỉ lệ với sai số
    ki: 0.3               # Integral     - triệt tiêu sai số xác lập (nhỏ để chống trôi)
    kd: 7.8             # Derivative   - giảm chấn, dập tắt dao động

    # --- Mục tiêu ---
    target_pitch: 0.0     # Góc pitch mục tiêu (rad). 0 = đứng thẳng

    # --- Giới hạn ---
    max_velocity: 2.5     # Vận tốc tối đa (m/s) - tăng lên 2.5 để bánh xe đủ trớn cứu xe khi nghiêng
    integral_max: 10.0    # Giới hạn anti-windup cho tích phân

    # --- Bộ lọc ---
    derivative_filter_alpha: 1 # Hệ số lọc đạo hàm (0-1, nhỏ = lọc mạnh)

    # --- Tùy chọn ---
    use_gyro_derivative: true     # Dùng gyro cho đạo hàm (khuyến nghị)
    fall_threshold: 0.785         # Ngưỡng ngã (~45°). Dừng motor khi vượt qua
    enabled: true                 # Bật/tắt controller

    # --- Vòng điều khiển Vận tốc & Vị trí (Chống trôi xe - Cascaded Loop) ---
    enable_velocity_control: true # Bật tự động phanh chống trôi
    kp_velocity: 0.08             # Giảm chấn vận tốc êm dịu, không giật
    kp_position: 0.015            # Lực kéo vị trí nhẹ nhàng, chống lắc lư
    max_pitch_adjustment: 0.06    # Giới hạn góc ngửa tối đa (~3.5 độ) êm ái


# =============================================
# Cấu hình PID Auto-Tuner (Thích Nghi Theo Dao Động)
# =============================================
# Thuật toán 100% tất định (không ngẫu nhiên):
# Tự động phân tích Mp, Ts, Drift, RMS sau mỗi lần huých
# để tính trực tiếp lượng điều chỉnh ΔKp, ΔKi, ΔKd.

pid_tuner:
  ros__parameters:
    # --- An toàn & Giới hạn ---
    fall_threshold: 0.785       # Ngưỡng ngã (rad, ~45°)
    max_velocity: 2.5           # Vận tốc tối đa (m/s) - tăng lên 2.5 để bánh xe đủ trớn cứu xe
    disturb_magnitude: 0.12     # Lực huých thử động lực học (m/s)

    # --- Thời gian mỗi bài thử nghiệm (giây) ---
    balance_duration: 3.5       # Thời gian kiểm tra đứng yên
    recovery_duration: 3.5      # Thời gian kiểm tra phục hồi sau cú huých

    # --- Số bước lặp tối đa (thường hội tụ sau 4-6 bước) ---
    max_iterations: 7

    # --- Bộ nhớ kế thừa ---
    # Đặt true nếu muốn xóa sạch kỷ lục cũ và bắt đầu từ bộ chuẩn [55, 0.5, 6.0]
    reset_memory: false

    # --- Lưu kết quả ---
    output_file: '~/tuned_pid_params.yaml'
